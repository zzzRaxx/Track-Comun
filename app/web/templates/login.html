{% extends "public.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<p class="muted">Entra para ver tus chats y conectar tus números.</p>
<form method="post" action="/login">
  {% if error %}<p class="error" role="alert" style="margin-top:14px">{{ error }}</p>{% endif %}
  <label for="email">Correo</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p style="margin-top:20px"><button class="btn" type="submit" style="width:100%">Entrar</button></p>
</form>
<p class="muted" style="margin-top:16px">¿No tienes cuenta? <a href="/register">Crear una cuenta</a></p>
{% endblock %}
