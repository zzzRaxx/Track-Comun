{% extends "public.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<p class="muted">Después podrás conectar tu número de WhatsApp.</p>
<form method="post" action="/register">
  {% if error %}<p class="error" role="alert" style="margin-top:14px">{{ error }}</p>{% endif %}
  <label for="name">Nombre (opcional)</label>
  <input id="name" name="name" type="text" autocomplete="name" value="{{ name }}">
  <label for="email">Correo</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <p class="hint">Mínimo 8 caracteres.</p>
  <p style="margin-top:20px"><button class="btn" type="submit" style="width:100%">Crear cuenta</button></p>
</form>
<p class="muted" style="margin-top:16px">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
{% endblock %}
